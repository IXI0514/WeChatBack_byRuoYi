# 若依前端容器内 nginx 配置
# 职责: 服务 dist 静态资源 + 反代 /prod-api/ 和 /miniapp/ 到后端 ruoyi-admin 容器
# 这个 nginx 跑在 ruoyi-ui 容器里,不直接对外,由顶层 nginx 再反代一层

server {
    listen       80;
    server_name  localhost;

    # 前端静态资源
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Vue history 路由模式需要 try_files 回退到 index.html
        try_files $uri $uri/ /index.html;
    }

    # 反代后端 API
    # 若依前端默认用 /prod-api 前缀调接口,这里去掉前缀转发到后端根路径
    location /prod-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        # 注意末尾斜杠: 会把 /prod-api/ 前缀去掉
        proxy_pass http://ruoyi-admin:8080/;
    }

    # 小程序接口需保留 /miniapp/ 前缀，才能匹配后端控制器。
    location ^~ /miniapp/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        proxy_pass http://ruoyi-admin:8080;
    }

    # 静态资源缓存
    location ~ .*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 错误页
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
