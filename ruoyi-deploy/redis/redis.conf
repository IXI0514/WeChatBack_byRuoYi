# 若依 Redis 7 配置
# 挂载到容器 /etc/redis/redis.conf

# 网络
bind 0.0.0.0
protected-mode yes
port 6379

# 密码由 docker-compose.yml 从 .env 的 REDIS_PASSWORD 注入。
# 此处的占位值会被容器启动命令覆盖，请勿在此处保存真实密码。
requirepass ChangeMe_RedisPwd_2026

# 内存上限(按机器配置调,2核4G 机器建议 256mb)
maxmemory 256mb
maxmemory-policy allkeys-lru

# 持久化 - RDB
save 900 1
save 300 10
save 60 10000

# 持久化 - AOF
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 客户端
timeout 300
tcp-keepalive 60

# 日志级别
loglevel notice
logfile ""

# 数据目录(容器内 /data,已挂载到宿主 ./data/redis)
dir /data
