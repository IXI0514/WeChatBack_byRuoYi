# 顶层 Nginx 反向代理 + HTTPS 配置
# 职责: 监听 80/443,处理 SSL 证书,反代前端页面 + 后端 API
#
# 反代架构:
#   /          → ruoyi-ui:80    (前端页面,PC 端管理后台)
#   /prod-api/ → ruoyi-admin:8080 (后端 API,PC 端若依默认前缀)
#   /miniapp/  → ruoyi-admin:8080 (小程序接口,保留请求路径)
#
# HTTPS 证书申请方式见 README.md 或执行 ./deploy.sh ssl
# 证书文件放 nginx/certs/fullchain.pem 和 nginx/certs/privkey.pem
#
# 没有证书时,先把下面 443 server 块注释掉,只用 80 端口访问
# 有小程序需求时,HTTPS 是必须的(微信小程序强制 HTTPS)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # 上传文件大小限制(若依默认 10M,这里放宽)
    client_max_body_size 50m;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_vary on;

    # 上游: 前端容器(服务 dist 静态资源)
    upstream ruoyi_ui {
        server ruoyi-ui:80;
    }

    # 上游: 后端容器(直接反代,不走前端,减少一跳)
    upstream ruoyi_admin {
        server ruoyi-admin:8080;
    }

    # ===== HTTP 80 端口 =====
    server {
        listen 80;
        server_name _;

        # Let's Encrypt 证书验证(申请证书时用)
        location /.well-known/acme-challenge/ {
            root /etc/nginx/certs/acme;
        }

        # 后端 API 直接反代到 ruoyi-admin(不走 ruoyi-ui 容器,减少一跳)
        # 若依 PC 端默认前缀 /prod-api/
        location /prod-api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
            # 注意末尾斜杠: 会去掉 /prod-api/ 前缀
            proxy_pass http://ruoyi_admin/;
        }

        # 小程序接口。这里不能在 proxy_pass 后加 "/"，否则 Nginx 会把
        # /miniapp/ 前缀替换掉，后端将收到 /login/verify 而无法匹配控制器。
        location ^~ /miniapp/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
            proxy_pass http://ruoyi_admin;
        }

        # 有证书后启用 HTTPS 跳转;没证书时直接反代到前端
        # 如果已有证书,取消下面注释,启用 301 跳转
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # 没证书时直接走 HTTP
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://ruoyi_ui;
        }
    }

    # ===== HTTPS 443 端口(有证书后取消注释) =====
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # 安全响应头
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #
    #     # 后端 API 直接反代
    #     location /prod-api/ {
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_connect_timeout 60s;
    #         proxy_read_timeout 120s;
    #         proxy_send_timeout 60s;
    #         proxy_pass http://ruoyi_admin/;
    #     }
    #
    #     # 小程序接口（保留 /miniapp/ 路径）
